name: Refresh Canadian availability and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
concurrency:
  group: squarewatch-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate calendar and Bingo
        run: node --test tests/core.test.mjs
      - name: Validate availability parser
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh Canadian viewing options
        run: python3 scripts/refresh_availability.py
      - name: Save dated availability snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/availability.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Canadian viewing availability"
            git push
          fi
      - name: Stage public files
        run: python3 scripts/stage_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Squarewatch
        id: deployment
        uses: actions/deploy-pages@v4
